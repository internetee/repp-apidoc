name: Build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '2.7'

    - uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: gems-${{ runner.os }}-2.7-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          gems-${{ runner.os }}-2.7-
          gems-${{ runner.os }}-

    - run: gem update --system

    - name: Install dependencies for nokogiri
      run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev libxml2-dev libxslt1-dev pkg-config libgmp-dev libffi-dev

    - run: bundle config set deployment 'true'

    - name: bundle install
      run: |
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3

    - run: bundle exec middleman build

ruby '2.7.8'    